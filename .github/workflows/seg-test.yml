name: Teste segmentação (temporário)
on:
  push:
    branches: [claude/outfit-builder-app-uehax1]
    paths: [tests/seg/**, .github/workflows/seg-test.yml]
permissions:
  contents: write
jobs:
  seg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save @huggingface/transformers@4.3.2
      - run: node tests/seg/sam.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seg-out && git commit -m "Resultado do teste de recorte (temporário)" && git push
