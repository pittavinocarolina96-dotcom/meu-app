name: Teste recorte (temporário)
on:
  push:
    branches: [claude/outfit-builder-app-uehax1]
    paths: [tests/seg/**, .github/workflows/seg-test.yml]
permissions:
  contents: write
jobs:
  seg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save @huggingface/transformers@4.3.2
      - name: Modelos
        run: |
          run() { /usr/bin/time -v node tests/seg/bench.mjs "$@" 2> /tmp/t.txt | tee -a seg-out-log.txt || true; grep -E "Maximum resident|Error|error" /tmp/t.txt | head -5 | sed "s|^|MEM $2 |" | tee -a seg-out-log.txt; }
          mkdir -p seg-out
          run SamModel Xenova/slimsam-77-uniform q8
          run Sam2Model onnx-community/sam2.1-hiera-tiny-ONNX q8
          run Sam2Model onnx-community/sam2.1-hiera-tiny-ONNX fp32
          run EdgeTamModel onnx-community/EdgeTAM-ONNX q8
          run EdgeTamModel onnx-community/EdgeTAM-ONNX fp32
          mv seg-out-log.txt seg-out/log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seg-out && git commit -m "Resultado do teste de recorte (temporário)" && git push
