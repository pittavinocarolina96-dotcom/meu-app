name: Teste recorte (temporário)
on:
  push:
    branches: [claude/outfit-builder-app-uehax1]
    paths: [tests/seg/**, .github/workflows/seg-test.yml, src/**]
permissions:
  contents: write
jobs:
  seg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: |
          (npx vite preview --port 4173 &) ; sleep 3
          node tests/seg/browser.cjs 2>&1 | tee log.txt || true
          mkdir -p seg-out && mv log.txt seg-out/
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seg-out && git commit -m "Resultado do teste de recorte (temporário)" && git push
